name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=core --cov=models --cov=pricing --cov=backtest --cov=microstructure
      - run: python run_research.py       # offline reproduction from the committed snapshot
      - run: python run_microstructure.py  # offline market-making experiment (no market data)
      - run: python heston_convergence.py --n-paths 1000 --n-fine 100  # convergence smoke test

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy core models pricing backtest microstructure
