[project]
name = "quantlab"
version = "0.1.0"
description = "Quantitative research: empirical analysis, option pricing, and strategy backtesting."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "yfinance",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff==0.15.20"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "models", "pricing", "backtest", "empirical", "microstructure"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
